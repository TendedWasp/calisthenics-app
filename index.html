<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1f2937">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Workout</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white antialiased pb-36">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function SetButton({ setNum }) {
      const [done, setDone] = useState(false);
      return (
        <button 
          onClick={() => setDone(!done)}
          className={`w-10 h-10 rounded-full flex items-center justify-center font-bold transition-colors ${done ? 'bg-blue-500 text-white' : 'bg-gray-700 text-gray-300'}`}
        >
          S{setNum}
        </button>
      );
    }

    function App() {
      const [timer, setTimer] = useState(0);
      const [isActive, setIsActive] = useState(false);
      const [difficulty, setDifficulty] = useState('Intermediate');
      const [time, setTime] = useState(30);

      useEffect(() => {
        let interval = null;
        if (isActive && timer > 0) {
          interval = setInterval(() => setTimer(t => t - 1), 1000);
        } else if (timer === 0) {
          setIsActive(false);
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [isActive, timer]);

      const startTimer = (seconds) => {
        setTimer(seconds);
        setIsActive(true);
      };

      const getExercises = () => {
        let sets = 3;
        if (time === 15) sets = 2;
        if (time === 45) sets = 4;

        const exerciseData = {
          Beginner: [
            { name: "Incline Push-ups", desc: "Hands elevated on a counter or chair, lower chest to edge.", reps: "10-12" },
            { name: "Doorway Rows", desc: "Hold a sturdy doorframe, lean back, pull chest to hands.", reps: "10-15" },
            { name: "Assisted Squats", desc: "Hold a chair for balance, sit back and down.", reps: "10-15" },
            { name: "Split Squats", desc: "Keep feet staggered, drop back knee straight down.", reps: "8-10 / leg" },
            { name: "Knee Plank", desc: "Rest on forearms and knees, keep hips flat in a straight line.", reps: "To form break" },
            { name: "Dead Bugs", desc: "Lie flat, arms up. Slowly lower opposite arm and leg to floor.", reps: "30 seconds" }
          ],
          Intermediate: [
            { name: "Push-ups", desc: "Body straight, lower chest to floor, elbows tucked at 45°.", reps: "To near failure" },
            { name: "Pull-ups / Inverted Rows", desc: "Pull chin over bar, or pull chest up to underneath a sturdy table.", reps: "To near failure" },
            { name: "Air Squats", desc: "Sit back until hips are below knees, keep chest up.", reps: "15-20" },
            { name: "Reverse Lunges", desc: "Step backward, drop back knee just above the floor.", reps: "10-12 / leg" },
            { name: "Forearm Plank", desc: "Rest on forearms and toes, keep lower back completely flat.", reps: "To form break" },
            { name: "Flutter Kicks", desc: "Lie on back, press lower back into floor, flutter straight legs.", reps: "30-45 seconds" }
          ],
          Advanced: [
            { name: "Decline Push-ups", desc: "Feet elevated on a chair or couch, lower chest to floor.", reps: "To near failure" },
            { name: "Pull-ups", desc: "Strict form, pull chin over bar, control the descent.", reps: "To near failure" },
            { name: "Jump Squats", desc: "Squat down, explode upward, land softly to absorb impact.", reps: "15-20" },
            { name: "Jumping Lunges", desc: "Lunge down, jump and switch legs in mid-air.", reps: "10-12 / leg" },
            { name: "Extended Plank", desc: "Rest on hands walked out past shoulders, hold core tight.", reps: "To form break" },
            { name: "Hollow Body Hold", desc: "Lower back glued to floor, arms and legs hovering off ground.", reps: "45-60 seconds" }
          ]
        };

        let routine = exerciseData[difficulty].map(ex => ({ ...ex, sets }));

        if (time === 15) return routine.slice(0, 5);
        return routine;
      };

      const exercises = getExercises();

      return (
        <div className="max-w-md mx-auto p-4">
          <h1 className="text-2xl font-bold mb-6 text-center text-blue-400">Workout Routine</h1>
          
          <div className="bg-gray-800 p-4 rounded-lg shadow mb-6">
            <div className="mb-4">
              <label className="block text-sm text-gray-400 mb-2">Difficulty</label>
              <div className="flex space-x-2">
                {['Beginner', 'Intermediate', 'Advanced'].map(lvl => (
                  <button 
                    key={lvl} 
                    onClick={() => setDifficulty(lvl)} 
                    className={`flex-1 py-2 rounded-md text-sm font-bold transition-colors ${difficulty === lvl ? 'bg-blue-500 text-white' : 'bg-gray-700 text-gray-300'}`}
                  >
                    {lvl}
                  </button>
                ))}
              </div>
            </div>

            <div>
              <label className="block text-sm text-gray-400 mb-2">Time Available</label>
              <div className="flex space-x-2">
                {[15, 30, 45].map(t => (
                  <button 
                    key={t} 
                    onClick={() => setTime(t)} 
                    className={`flex-1 py-2 rounded-md text-sm font-bold transition-colors ${time === t ? 'bg-blue-500 text-white' : 'bg-gray-700 text-gray-300'}`}
                  >
                    {t} min
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="bg-gray-800 p-4 rounded-lg shadow mb-6 border-l-4 border-yellow-500">
            <h2 className="text-xl font-semibold mb-2">Warm-up (5 mins)</h2>
            <ul className="list-disc list-inside text-gray-300 space-y-1 text-sm">
              <li>Arm Circles (30s forward & back)</li>
              <li>Torso Twists (30s)</li>
              <li>Leg Swings (10 per leg)</li>
              <li>Deep Squat Hold (30s)</li>
            </ul>
          </div>

          <div key={difficulty + time} className="space-y-6">
            {exercises.map((ex, i) => (
              <div key={i} className="bg-gray-800 p-4 rounded-lg shadow">
                <h2 className="text-xl font-semibold mb-1">{ex.name}</h2>
                <p className="text-gray-300 text-sm mb-3">{ex.desc}</p>
                <p className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-4">Target: {ex.reps}</p>
                
                <div className="flex space-x-3">
                  {Array.from({ length: ex.sets }).map((_, setIdx) => (
                    <SetButton key={setIdx} setNum={setIdx + 1} />
                  ))}
                </div>
              </div>
            ))}
          </div>

          {/* Redesigned Rest Timer */}
          <div className="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 p-4 pb-6">
            <div className="max-w-md mx-auto flex flex-col space-y-3">
              <div className="flex items-center justify-between">
                <div className="text-gray-300 font-semibold flex items-center">
                  Rest Timer: 
                  <span className={`ml-3 text-2xl font-mono ${isActive ? 'text-green-400' : 'text-blue-400'}`}>
                    {Math.floor(timer / 60)}:{(timer % 60).toString().padStart(2, '0')}
                  </span>
                </div>
                <button onClick={() => { setTimer(0); setIsActive(false); }} className="px-4 py-2 bg-red-500/10 text-red-400 rounded-md font-bold active:bg-red-500/20">Stop</button>
              </div>
              
              <div className="flex space-x-2">
                <button onClick={() => startTimer(120)} className="flex-1 py-2 bg-gray-800 rounded-md active:bg-gray-700 flex flex-col items-center justify-center text-center">
                  <span className="text-[10px] sm:text-xs font-bold text-gray-200 uppercase tracking-wider">Pure Strength</span>
                  <span className="text-sm font-mono text-blue-400 mt-1">2m</span>
                </button>
                <button onClick={() => startTimer(60)} className="flex-1 py-2 bg-gray-800 rounded-md active:bg-gray-700 flex flex-col items-center justify-center text-center">
                  <span className="text-[10px] sm:text-xs font-bold text-gray-200 uppercase tracking-wider">Gen. Fitness</span>
                  <span className="text-sm font-mono text-blue-400 mt-1">60s</span>
                </button>
                <button onClick={() => startTimer(30)} className="flex-1 py-2 bg-gray-800 rounded-md active:bg-gray-700 flex flex-col items-center justify-center text-center">
                  <span className="text-[10px] sm:text-xs font-bold text-gray-200 uppercase tracking-wider">Fat Loss</span>
                  <span className="text-sm font-mono text-blue-400 mt-1">30s</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
